title: "Dr. Semuhi Sinanoglu"
url: "https://semuhi.github.io"
author: "Dr. Semuhi Sinanoglu"
# Site-wide fallback description. Pages that set their own `description:` win;
# see the head of _layouts/constellation.html.
description: "Semuhi Sinanoglu is a senior researcher at IDOS in Bonn. He studies authoritarian propaganda, repression, polarization, and democracy support."
permalink: /:title/
lang: "en"

# The Constellation system (spec v3) renders everything: layout _layouts/constellation.html,
# data in _data/, styles in _sass/constellation/. The old Bulma theme (layouts, includes,
# top-level _sass files, vendored KaTeX/jQuery) was deleted 2026-07-20 after the security
# audit confirmed nothing referenced it.

plugins:
 - jekyll-feed
 - jekyll-sitemap

exclude:
 - worklog.html           # internal work log, not for publication
 - _design/
 - tools/                 # site build helpers (gen-pub-pages.rb), not content
